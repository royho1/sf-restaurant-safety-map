server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths serve index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Browser still calls same-origin `/api/...` (VITE_API_BASE unset).
    # nginx (inside this container) forwards to the Compose service named `api`.
    # That DNS name only resolves on the Compose network — the browser never sees it.
    location /api/ {
        # Step 3 wires service `api` on port 5001. Until then this 502s — expected.
        proxy_pass http://api:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
