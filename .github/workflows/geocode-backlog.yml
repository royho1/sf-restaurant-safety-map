name: Geocode coordinate backlog

on:
  schedule:
  # First Monday of each month at 16:00 UTC
    - cron: "0 16 1-7 * 1"
  workflow_dispatch:

jobs:
  geocode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline deps
        run: pip install -r scripts/requirements.txt
      - name: Backfill missing coordinates
        run: python scripts/refresh_data.py --geocode-only --max-geocodes 500
      - name: Validate processed data
        run: python scripts/validate_data.py --json
      - name: Commit snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Backfill restaurant coordinates from geocode pass"
          git push
