name: Refresh inspection data

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline deps
        run: pip install -r scripts/requirements.txt
      - name: Refresh from DataSF
        run: python scripts/refresh_data.py --skip-geocode
      - name: Commit snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Refresh inspection snapshot from DataSF"
          git push
